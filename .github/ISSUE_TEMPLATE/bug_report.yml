name: Bug report
description: Report a defect in the Aurora SDK, examples, or repository automation.
title: "Fix: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem clearly and briefly.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What is broken
      description: Explain the observed failure, regression, or incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the commands, files, hardware steps, or patch conditions needed to reproduce it.
      placeholder: |
        1. Run `...`
        2. Build `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include toolchain, OS, board revision, and firmware context when relevant.
      placeholder: |
        - OS:
        - Toolchain:
        - Board revision:
        - Example or firmware:
    validations:
      required: false
